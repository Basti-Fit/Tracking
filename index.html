<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Formbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Formbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column in a night-gym look. Bumper-plate colours code the areas:
   red = training, yellow = calories, blue = protein, green = sleep. Single dark theme on purpose. */
:root {
  color-scheme: dark;
  --bg: #0A0D13;
  --surface: #131823;
  --surface2: #1A2130;
  --line: #262F40;
  --ink: #EEF1F6;
  --muted: #8E98AB;
  --red: #E8383D;
  --red-rgb: 232,56,61;
  --blue: #3D7BFF;
  --yellow: #F6C41A;
  --green: #2DBB74;
  --plate-white: #E6EAF1;
  --font-display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
/* Accent themes and the optional light mode (own attributes, set from the in-app Design panel) */
:root[data-acc="orange"] { --red: #FF7A1A; --red-rgb: 255,122,26; }
:root[data-acc="pink"] { --red: #FF3D8B; --red-rgb: 255,61,139; }
:root[data-acc="lila"] { --red: #9B5CFF; --red-rgb: 155,92,255; }
:root[data-acc="tuerkis"] { --red: #12C2B0; --red-rgb: 18,194,176; }
:root[data-fb="light"] { color-scheme: light; --bg: #EEF1F5; --surface: #FFFFFF; --surface2: #E2E7EF; --line: #D2D9E4; --ink: #12151B; --muted: #5A6374; --yellow: #C99A00; --green: #1C9A5C; --plate-white: #9AA3B2; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; padding: 9px 4px; font-weight: 700; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
/* Muscle map + calendar */
.body { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
.body .nb { fill: var(--line); }
.body .mz { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
.body text { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-family: var(--font-body); }
.heatlegend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); }
.heatlegend span { display: inline-flex; align-items: center; gap: 5px; }
.heatlegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.mlist { display: grid; gap: 10px; margin-top: 10px; }
.mgroup { display: grid; gap: 4px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 30px; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; padding-block: 2px; }
.mrow .num { text-align: right; font-weight: 700; }
.mbar { position: relative; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; }
.mbar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .35; }
.tip { font-size: 13px; color: var(--muted); border-left: 3px solid var(--red); padding: 3px 0 3px 9px; }
.tip b { color: var(--ink); }
.tip-up { border-color: var(--green); }
.tip-up b { color: var(--green); }
.mnote { background: none; border: 0; padding: 0; text-align: left; font-size: 13px; color: var(--muted); justify-self: start; }
.mnote b { color: var(--ink); font-weight: 600; }
.edit-ex2 { display: grid; gap: 6px; padding-block: 9px; border-bottom: 1px solid var(--line); }
.edit-ex2 select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 8px; font-size: 14px; }
.reader { width: 100%; max-width: 420px; margin: 0 auto; min-height: 220px; border-radius: 14px; overflow: hidden; background: #000; }
.reader video { width: 100% !important; height: auto !important; display: block; }
.cal { width: 100%; height: auto; display: block; }
.cal text { fill: var(--muted); font-size: 9px; font-family: var(--font-body); font-weight: 600; }
.cal rect { cursor: pointer; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; line-height: .95; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in, main { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; font-family: var(--font-display); font-weight: 900; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.brand-plates { display: flex; gap: 2px; align-items: center; }
.brand-plates i { display: block; width: 5px; border-radius: 2px; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav button { background: var(--surface); border: 1px solid var(--line); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.datenav button:disabled { opacity: .3; cursor: default; }
.datelabel { min-width: 92px; text-align: center; font-weight: 700; font-size: 15px; }

main { padding-block: 16px calc(110px + env(safe-area-inset-bottom, 0px)); transition: padding .2s ease; }
body.resting main { padding-bottom: calc(176px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
h2 { font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: .9; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin: 0; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }

.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 10px 15px; font-weight: 700; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.ghost { background: none; }
.btn.small { padding: 7px 11px; font-size: 14px; }
.btn.block { width: 100%; padding: 14px; font-size: 17px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--red); }
.field { display: grid; gap: 5px; min-width: 0; }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 11px; min-width: 0; }
.field input:focus, .field select:focus { border-color: var(--blue); outline: none; }

/* Heute: hero */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 18px; background:
  radial-gradient(120% 90% at 100% 0%, rgba(var(--red-rgb),.28), transparent 55%),
  radial-gradient(90% 80% at 0% 100%, rgba(61,123,255,.22), transparent 60%), var(--surface); border: 1px solid var(--line); display: grid; gap: 14px; }
.lvl { display: flex; align-items: center; gap: 14px; }
.lvl-badge { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--yellow) calc(var(--p) * 1%), var(--surface2) 0); position: relative; }
.lvl-badge::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg); }
.lvl-badge b { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 900; font-size: 28px; }
.lvl-title { font-family: var(--font-display); font-weight: 900; font-size: 26px; text-transform: uppercase; line-height: 1; }
.xpbar { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--red)); border-radius: 99px; }
.streak { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 900; font-size: 30px; margin-left: auto; }
.streak svg { width: 26px; height: 26px; }
.streak small { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: block; line-height: 1.1; }

.rings { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
@media (max-width: 360px) { .rings { grid-template-columns: 1fr; justify-items: center; } }
.rings svg { width: 150px; height: 150px; transform: rotate(-90deg); }
.rings circle { fill: none; stroke-linecap: round; }
.ringlegend { display: grid; gap: 10px; width: 100%; }
.ringlegend div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.ringlegend i { width: 10px; height: 10px; border-radius: 50%; }
.ringlegend b { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.ringlegend span.of { color: var(--muted); font-size: 13px; }

.cta { border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; background: linear-gradient(135deg, rgba(var(--red-rgb),.22), rgba(var(--red-rgb),.05) 60%), var(--surface); border: 1px solid rgba(var(--red-rgb),.45); }
.cta .disp { font-size: 36px; text-transform: uppercase; }
.cta.restday { background: linear-gradient(135deg, rgba(45,187,116,.22), rgba(45,187,116,.04) 60%), var(--surface); border-color: rgba(45,187,116,.45); }

/* Training */
.wohead { display: grid; gap: 8px; }
.progress { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--red); border-radius: 99px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.ex.complete { border-color: rgba(45,187,116,.5); }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ex-name { font-family: var(--font-display); font-weight: 800; font-size: 23px; text-transform: uppercase; line-height: 1; }
.plates { display: flex; gap: 4px; }
.plates i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.plates i.on { background: var(--red); border-color: var(--red); }
.last { font-size: 13px; color: var(--muted); }
.last b { color: var(--ink); font-weight: 700; }
.prtag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #0A0D13; background: var(--yellow); border-radius: 6px; padding: 2px 6px; }
.sets { display: grid; gap: 6px; }
.set, .sethead { display: grid; grid-template-columns: 34px 1fr 1fr 46px; gap: 8px; align-items: center; }
.set .n { font-family: var(--font-display); font-weight: 900; font-size: 22px; color: var(--muted); text-align: center; }
.set input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.set input:focus { border-color: var(--blue); outline: none; }
.set.better input { border-color: var(--green); }
.set.pr input { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow) inset; }
.set.done .n { color: var(--green); }
.sethead span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; text-align: center; font-weight: 700; }
.check { width: 46px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--muted); }
.check[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #06130C; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--yellow); padding-left: 10px; }
.edit-ex { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { background: none; border: 0; width: 34px; height: 34px; font-size: 18px; }
.stepper span { min-width: 58px; text-align: center; font-size: 14px; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }

/* Rest timer pill */
.rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 7; background: var(--surface2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 6px 6px 8px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); }
.rest svg { width: 40px; height: 40px; transform: rotate(-90deg); flex: none; }
.rest .t { font-family: var(--font-display); font-weight: 900; font-size: 28px; min-width: 62px; }
.rest .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; display: block; line-height: 1; }
.rest button { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; height: 36px; min-width: 44px; padding: 0 10px; font-weight: 700; font-size: 14px; }
.rest.over { border-color: var(--green); }
.rest.over .t { color: var(--green); }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 div { background: var(--bg); border-radius: 12px; padding: 12px 8px; text-align: center; }
.stats3 b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 1; }
.stats3 span { font-size: 12px; color: var(--muted); }

/* Food */
.entry { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding-block: 9px; border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: 0; }
.entry .meta { font-size: 14px; color: var(--muted); text-align: right; }
.mealslot { display: grid; gap: 8px; }
.opt { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; background: var(--bg); }
.opt ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.addform { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; align-items: end; }
@media (max-width: 420px) { .addform { grid-template-columns: 1fr 1fr; } .addform .field:first-child { grid-column: 1 / -1; } }
details > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; font-size: 24px; color: var(--muted); }
details[open] > summary::after { content: "–"; }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.macros div { background: var(--bg); border-radius: 10px; padding: 8px 4px; text-align: center; }
.macros b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 900; }
.macros span { font-size: 12px; color: var(--muted); }
.prose { font-size: 15px; display: grid; gap: 6px; }
.prose p { margin: 0; }
.meter { display: grid; gap: 6px; }
.meter .bar { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 99px; }
.bigval { font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 1; }
.bigval small { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }

/* Sleep */
.qual { display: flex; gap: 6px; }
.qual button { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 0; font-weight: 800; font-family: var(--font-display); font-size: 20px; }
.qual button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #06130C; }

/* Charts, badges */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.empty { color: var(--muted); font-size: 15px; padding: 8px 0; margin: 0; }
.hint { border-radius: 12px; padding: 11px 13px; font-size: 15px; background: rgba(61,123,255,.14); border: 1px solid rgba(61,123,255,.35); }
.hint.warn { background: rgba(246,196,26,.12); border-color: rgba(246,196,26,.4); }
.tag-good { color: var(--green); font-weight: 700; }
.tag-warn { color: var(--yellow); font-weight: 700; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.badge .medal { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 18px; color: var(--bg); }
.badge b { font-size: 13px; line-height: 1.15; }
.badge span { font-size: 11px; color: var(--muted); line-height: 1.2; }
.badge.locked .medal { background: var(--surface2) !important; color: var(--muted); }
.badge.locked b { color: var(--muted); }
.prlist { display: grid; gap: 0; }
.prlist div { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.prlist div:last-child { border-bottom: 0; }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
nav.tabs button { background: none; border: 0; padding: 9px 0 8px; display: grid; justify-items: center; gap: 3px; font-size: 11px; white-space: nowrap; font-weight: 700; color: var(--muted); }
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] svg { color: var(--red); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg); padding: 10px 15px; border-radius: 12px; font-size: 15px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.toast.gold { background: var(--yellow); }
.loading { padding: 60px 0; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }

/* XP, levels, streaks, PRs, achievements: computed from the log, nothing extra stored */
function computeStats() {
  const t = S.settings.targets; let xp = 0, workouts = 0, prs = 0, setsDone = 0, weighIns = 0;
  let protRun = 0, protBest = 0, sleepRun = 0, sleepBest = 0;
  const best = {}, prEvents = []; let prev = null;
  for (const d of sortedDates()) {
    const day = S.days[d];
    if (prev && addDays(prev, 1) !== d) { protRun = 0; sleepRun = 0; }
    prev = d;
    const wp = woProgress(day);
    xp += wp.done * 10; setsDone += wp.done;
    if (wp.done && wp.done >= wp.total / 2) { xp += 50; workouts++; }
    if (day.rest && !wp.done) xp += 20;
    const ft = foodTotals(day);
    xp += Math.min(4, (day.food || []).length) * 5;
    if (ft.p >= t.p) { xp += 25; protRun++; } else protRun = 0;
    protBest = Math.max(protBest, protRun);
    if (ft.k && Math.abs(ft.k - t.kcal) <= t.kcal * 0.1) xp += 25;
    const sh = sleepHours(day.sleep);
    if (sh != null) { xp += 5; if (sh >= t.sleep - 0.25) { xp += 20; sleepRun++; } else sleepRun = 0; } else sleepRun = 0;
    sleepBest = Math.max(sleepBest, sleepRun);
    if (day.weight != null) { xp += 5; weighIns++; }
    for (const pid in day.wo || {}) for (const ex in day.wo[pid]) {
      let dayBest = 0, dayBestSet = null;
      day.wo[pid][ex].forEach((s) => { if (s && s.d && e1rm(s) > dayBest) { dayBest = e1rm(s); dayBestSet = s; } });
      if (dayBest) {
        const g = day.gym || "", key = ex + "\u0001" + g;
        let prior = 0;
        for (const k in best) { const b = best[k]; if (b.ex === ex && (!g || !b.gym || b.gym === g)) prior = Math.max(prior, b.v); }
        if (prior && dayBest > prior + 0.01) { prs++; xp += 40; prEvents.push({ d, ex, s: dayBestSet, gym: g }); }
        if (!best[key] || dayBest > best[key].v) best[key] = { v: dayBest, s: dayBestSet, d, ex, gym: g };
      }
    }
  }
  xp += Object.values(S.checkins).filter((c) => c.done).length * 30;
  let streak = 0, cur = today();
  if (!dayActive(S.days[cur])) cur = addDays(cur, -1);
  while (dayActive(S.days[cur])) { streak++; cur = addDays(cur, -1); }

  const lo = 125 * (lvl - 1) * lvl, hi = 125 * lvl * (lvl + 1);
  return { xp, lvl, title: TITLES[Math.min(lvl - 1, TITLES.length - 1)], lvlPct: (xp - lo) / (hi - lo) * 100, toNext: hi - xp, streak, workouts, prs, setsDone, weighIns, protBest, sleepBest, best, prEvents };
}

  const scale = t.kcal / 2875;
  const scaleTxt = Math.abs(scale - 1) > 0.07 ? '<p><b>Portionen anpassen:</b> Die Mengen unten sind für etwa 2.900 kcal gedacht. Für dein Ziel nimm ungefähr ' + Math.round(scale * 100) + ' % davon.</p>' : '';

  const ctl = gk === "cut" ? "Ziel ist etwa 0,5 bis 1 % deines Gewichts weniger pro Woche. Geht es zwei Wochen lang nicht runter, iss etwa 200 kcal weniger." : gk === "bulk" ? "Ziel ist etwa 1,5 bis 2,5 kg mehr pro Monat. Steht das Gewicht zwei Wochen lang, iss etwa 200 kcal mehr." : "Ziel ist etwa 0,5 bis 1,5 kg mehr pro Monat. Steht das Gewicht zwei Wochen lang, iss etwa 200 kcal mehr.";
  h += '<div class="prose"><p><b>Kontrolle:</b> Morgens wiegen und auf den Wochenschnitt im Verlauf schauen. ' + ctl + '</p><p><b>Meal Prep:</b> Mittagessen für 2 bis 3 Tage am Stück kochen und in Dosen mitnehmen. Hält im Kühlschrank etwa 3 Tage.</p><p>Die kcal-Werte sind gerundete Richtwerte. Für eigene Gerichte reicht eine grobe Schätzung, wichtig ist die Tendenz über die Woche.</p></div>';
  return h + '</details>';
}

  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ["#E8383D", "#3D7BFF", "#F6C41A", "#2DBB74", "#E6EAF1"];
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio, r: (4 + Math.random() * 6) * devicePixelRatio, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();

    ps.forEach((p) => { p.vy += .55 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .45, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });

    case "restadd": Rest.end += 15000; Rest.total += 15; Rest.beeped = Rest.end < Date.now(); tickRest(); break;
    case "reststop": stopRest(); break;
    case "restcycle": { const opts = [60, 90, 120, 150, 180], cur = S.settings.restSec || 120; S.settings.restSec = opts[(opts.indexOf(cur) + 1) % opts.length] || 120; saveSettings(); render(); break; }
    case "editplan": S.editPlan = true; render(); break;
    case "editdone": S.editPlan = false; render(); break;
    case "setsminus": { const e = plan.ex[+b.dataset.i]; if (e[1] > 1) { e[1]--; saveSettings(); render(); } break; }
    case "setsplus": { const e = plan.ex[+b.dataset.i]; if (e[1] < 8) { e[1]++; saveSettings(); render(); } break; }
    case "exdel": plan.ex.splice(+b.dataset.i, 1); saveSettings(); render(); break;
    case "exadd": { const v = ($("#newex").value || "").trim(); if (v) { if (plan.ex.some((e) => e[0] === v)) { toast("Diese Übung ist schon im Plan."); break; } plan.ex.push([v.slice(0, 60), 2]); saveSettings(); render(); } break; }
    case "resetplan": { const def = DEFAULT_SETTINGS.plan.find((p) => p.id === plan.id); if (def) { plan.ex = clone(def.ex); saveSettings(); render(); toast("Plan zurückgesetzt."); } break; }
    case "addmeal": { const o = MEALS[+b.dataset.m].opts[+b.dataset.o]; if ((getDay(S.date).food || []).length < 4) xpFloat(b.getBoundingClientRect(), "+5 XP"); const before = foodTotals(getDay(S.date)).p; mutateDay(S.date, (d) => { d.food = d.food || []; d.food.push({ id: rid(), n: o.n, k: o.k, p: o.p }); }); afterFood(before, o.n); break; }
    case "addfood": {
      const n = ($("#fname").value || "").trim(), k = num($("#fk").value), p = num($("#fp").value);
      if (!n || k == null) { toast("Gib mindestens einen Namen und die kcal an."); break; }
      const before = foodTotals(getDay(S.date)).p;
      mutateDay(S.date, (d) => { d.food = d.food || []; d.food.push({ id: rid(), n: n.slice(0, 60), k: Math.round(k), p: Math.round(p || 0) }); });
      afterFood(before, n); break;
    }
    case "delfood": mutateDay(S.date, (d) => { d.food = (d.food || []).filter((f) => f.id !== b.dataset.id); }); break;
    case "qual": { const q = +b.dataset.q; mutateDay(S.date, (d) => { d.sleep = Object.assign({}, d.sleep || {}); d.sleep.q = d.sleep.q === q ? null : q; }); break; }
  }
});
function afterFood(beforeP, name) {
  const now = foodTotals(getDay(S.date)).p, tp = S.settings.targets.p;
  if (beforeP < tp && now >= tp) { toast("Eiweißziel geschafft! +25 XP", true); confetti(); }
  else toast(name + " eingetragen.");
}

document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.field) {
    if (S.cf && !$("#sheet").hidden) return;
    const plan = planById(S.trainDay), ei = +el.dataset.ex, si = +el.dataset.set, name = plan.ex[ei][0], v = num(el.value), field = el.dataset.field;
    const prevSet = ((getDay(S.date).wo || {})[plan.id] || {})[name], prev = prevSet && prevSet[si] ? prevSet[si][field] : null;
    mutateDay(S.date, (d) => {
      d.wo = d.wo || {}; d.wo[plan.id] = d.wo[plan.id] || {};
      const arr = d.wo[plan.id][name] = d.wo[plan.id][name] || [];
      for (let i = 0; i <= si; i++) if (!arr[i]) arr[i] = {};
      if (!d.gym && gymFor(S.date)) d.gym = gymFor(S.date);
      arr[si][field] = field === "r" && v != null ? Math.round(v) : v;
    }, false);
    const s = getDay(S.date).wo[plan.id][name][si], last = lastSets(name, S.date), row = document.getElementById("row-" + ei + "-" + si);
    const refresh = () => { const isPr = checkPr(plan, ei, si); const r2 = document.getElementById("row-" + ei + "-" + si); if (r2) { r2.classList.toggle("pr", isPr); r2.classList.toggle("better", !isPr && isBetter(s, last && last.sets[si])); } };
    const why = suspicious(name, s, si);
    if (why && !S.okVals.has(susKey(name, si, s))) {
      askConfirm({ title: "Stimmt das?", body: '<p class="sub" style="font-size:16px">' + esc(name) + ', Satz ' + (si + 1) + ': <b style="color:var(--ink)">' + esc(why) + '</b>. Vertippt?</p>',
        yes: () => { S.okVals.add(susKey(name, si, s)); refresh(); },
        no: () => { mutateDay(S.date, (d) => { d.wo[plan.id][name][si][field] = prev; }, false); const inp = document.getElementById((field === "w" ? "w-" : "r-") + ei + "-" + si); if (inp) { inp.value = prev != null ? (field === "w" ? fkg(prev) : prev) : ""; inp.focus(); } } });
      return;
    }
    refresh();
    return;
  }
  if (el.id === "chartex") { S.chartEx = el.value; render(); return; }
  if (el.id === "chartgym") { S.chartGym = el.value; render(); return; }
  if (el.dataset && el.dataset.pose && el.files && el.files[0]) {
    const pose = el.dataset.pose, wk = isoWeek(S.date), file = el.files[0];
    toast("Foto wird gespeichert …");
    compressImage(file).then(async (data) => {
      await Photos.put(wk + "-" + pose, data);
      const c = clone(getCheckin(wk)); c.photos = c.photos || {}; c.photos[pose] = true; saveCheckin(c); render(); toast("Foto gespeichert.");
    }).catch(() => toast("Das Foto konnte nicht gespeichert werden. Versuch ein anderes."));
    return;
  }
  if (el.id === "cinotes") { const wk = isoWeek(S.date), c = clone(getCheckin(wk)); c.notes = el.value.slice(0, 2000); saveCheckin(c); return; }
  if (el.id === "ciname") { S.settings.profile = { name: el.value.trim().slice(0, 40) }; saveSettings(); return; }
  if (el.id === "ciconsent") { S.settings.consent = el.checked ? today() : null; saveSettings(); return; }
  if (el.id === "cmpa" || el.id === "cmpb") { S[el.id === "cmpa" ? "cmpA" : "cmpB"] = el.value; render(); return; }
  if (el.id === "scanfile" && el.files && el.files[0]) { scanFromFile(el.files[0]); el.value = ""; return; }
  if (el.id === "importfile" && el.files && el.files[0]) { importFile(el.files[0]); el.value = ""; return; }
  if (el.id && el.id.indexOf("rr-") === 0) { const pl = planById(S.trainDay), e = pl && pl.ex[+el.id.slice(3)]; if (e) { e[2] = el.value; saveSettings(); render(); } return; }
  if (el.dataset && el.dataset.note != null) { const pl = planById(S.trainDay), e = pl && pl.ex[+el.dataset.note]; if (e) { setNote(e[0], el.value.trim()); toast("Einstellung gespeichert."); } return; }
  switch (el.id) {
    case "weight": {
      const v = num(el.value); if (el.value && (v == null || v < 30 || v > 250)) { toast("Bitte ein Gewicht in kg eingeben, z. B. 72,4."); return; }
      const before = getDay(S.date).weight, prevW = (() => { const ds = sortedDates().filter((d) => d < S.date).reverse(); for (const d of ds) if (S.days[d].weight != null) return S.days[d].weight; return null; })();
      const save = () => { mutateDay(S.date, (d) => { d.weight = v; }, false); toast("Gewicht gespeichert. +5 XP"); };
      if (v != null && prevW != null && Math.abs(v - prevW) > 4) { askConfirm({ title: "Stimmt das?", body: '<p class="sub" style="font-size:16px"><b style="color:var(--ink)">' + fmt(v, 1) + ' kg</b>, beim letzten Wiegen waren es ' + fmt(prevW, 1) + ' kg. Vertippt?</p>', yes: save, no: () => { el.value = before != null ? fmt(before, 1) : ""; el.focus(); } }); return; }
      save(); break;
    }
    case "bed": case "wake": {
      mutateDay(S.date, (d) => { d.sleep = Object.assign({}, d.sleep || {}); d.sleep[el.id] = el.value || null; }, false);
      const hrs = sleepHours(getDay(S.date).sleep); $("#sleephrs").innerHTML = hrs != null ? fmt(hrs, 1) + "<small>h</small>" : "–"; break;
    }
    case "tk": case "tp": case "tf": case "tc": case "ts": {
      const map = { tk: "kcal", tp: "p", tf: "f", tc: "c", ts: "sleep" }, v = num(el.value);
      if (v == null || v <= 0) { toast("Bitte eine Zahl eingeben."); return; }
      S.settings.targets[map[el.id]] = v; saveSettings(); toast("Ziel gespeichert."); break;
    }
  }
});
document.addEventListener("input", (ev) => { if (ev.target.id === "fgram") updateFoodPreview(); });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !$("#sheet").hidden) { if (S.cf) closeConfirm("no"); else closeSheet(); return; }
  if (ev.key === "Enter" && ev.target.id === "scancode") { ev.preventDefault(); lookupFood(ev.target.value); return; }
  if (ev.key === "Enter" && ev.target.id === "fgram") { ev.preventDefault(); addFoodEntry(); return; }
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.note != null) { ev.preventDefault(); ev.target.blur(); S.noteEdit = null; render(); return; }
  if (ev.key !== "Enter") return;
  if (["fname", "fk", "fp"].includes(ev.target.id)) { ev.preventDefault(); document.querySelector('[data-action="addfood"]').click(); }
  if (ev.target.id === "newgym") { ev.preventDefault(); document.querySelector('[data-action="gymadd"]').click(); }
  if (ev.target.id === "newex") { ev.preventDefault(); document.querySelector('[data-action="exadd"]').click(); }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== S.tab) setTab(h); });

/* ---------- Offline (own hosting only) ---------- */
if (STANDALONE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

/* ---------- Boot ---------- */
const BOOT_T0 = performance.now();
if (STANDALONE && !reduced()) { const sp = $("#splash"); if (sp) sp.hidden = false; }
function hideSplash() {
  const sp = $("#splash"); if (!sp || sp.hidden) return;
  setTimeout(() => { sp.classList.add("out"); setTimeout(() => sp.remove(), 450); }, Math.max(0, 1250 - (performance.now() - BOOT_T0)));
}
(async function boot() {
  await Store.init();
  try {
    const { settings, days, checkins } = await Store.load();
    if (settings && settings.plan && settings.targets) S.settings = Object.assign(clone(DEFAULT_SETTINGS), settings);
    S.days = days || {}; S.checkins = checkins || {};
    applyTheme();
  } catch (e) {
    if (Store.mode === "cloud") Store.blocked = true;
    toast("Deine Daten sind gerade nicht erreichbar. Lade die Seite später neu.");
  }
  try { render(); hideSplash(); }
  catch (e) {
    const sp = $("#splash"); if (sp) sp.remove();
    const l = document.getElementById("loading") || $("#app");
    const p = document.createElement("p"); p.className = "loaderr";
    p.textContent = "Fehler beim Start: " + (e && e.message ? e.message : e) + "\nSchick davon einen Screenshot an den, der dir die App gegeben hat.";
    l.appendChild(p);
  }
})();
})();
</script>
